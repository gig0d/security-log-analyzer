name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install exact dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install editable application
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test with branch coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Exercise installed CLI
        run: security-log-analyzer demo --db data/ci-demo.db --directory data/ci-inputs --json
      - name: Build distributable wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          retention-days: 7
