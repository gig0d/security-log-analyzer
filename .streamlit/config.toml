[server]
address = "127.0.0.1"
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#56d4bd"
backgroundColor = "#0d1420"
secondaryBackgroundColor = "#182333"
textColor = "#e7edf5"
font = "sans serif"
